<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Seedbeat app icon: four lanes in the Synthwave palette converging on a hit line (DESIGN.md §2). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a3a"/>
      <stop offset="1" stop-color="#0b0912"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3fa4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3fa4" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- highway -->
  <path d="M212 120 L300 120 L420 400 L92 400 Z" fill="url(#glow)"/>
  <path d="M212 120 L92 400" stroke="#ff3fa4" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <path d="M300 120 L420 400" stroke="#ff3fa4" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <!-- notes, one per lane -->
  <rect x="150" y="262" width="54" height="22" rx="8" fill="#ff3fa4"/>
  <rect x="214" y="200" width="42" height="18" rx="7" fill="#ff9a3c"/>
  <rect x="262" y="236" width="48" height="20" rx="7" fill="#3cf0ff"/>
  <rect x="312" y="300" width="64" height="24" rx="9" fill="#b26bff"/>
  <!-- hit line and receptors -->
  <rect x="92" y="400" width="328" height="8" rx="4" fill="#3cf0ff"/>
  <rect x="100" y="420" width="72" height="20" rx="8" fill="none" stroke="#ff3fa4" stroke-width="5"/>
  <rect x="182" y="420" width="72" height="20" rx="8" fill="none" stroke="#ff9a3c" stroke-width="5"/>
  <rect x="264" y="420" width="72" height="20" rx="8" fill="none" stroke="#3cf0ff" stroke-width="5"/>
  <rect x="346" y="420" width="66" height="20" rx="8" fill="none" stroke="#b26bff" stroke-width="5"/>
</svg>
