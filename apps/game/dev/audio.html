<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seedbeat · audio dev page</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #0b0912;
        color: #f3effc;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        letter-spacing: 0.08em;
      }
      p.dim,
      .dim {
        color: #a39cbd;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a39cbd;
      }
      input,
      select,
      button {
        font: inherit;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        background: #17121f;
        color: #f3effc;
        border: 1px solid rgba(226, 214, 255, 0.14);
        border-radius: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      button {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(226, 214, 255, 0.14);
        background: #17121f;
        color: #f3effc;
        cursor: pointer;
      }
      button.primary {
        background: #ff3fa4;
        color: #0b0912;
        border-color: transparent;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      pre {
        background: #17121f;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
        white-space: pre-wrap;
        min-height: 6em;
      }
      .controls {
        margin-top: 16px;
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(4, 1fr);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SEEDBEAT · audio</h1>
      <p class="dim">
        A/B the AudioWorklet engine against the prototype by ear. Same seed and mood give the same
        song in both.
      </p>
      <label for="seed">Seed</label>
      <div class="row">
        <input id="seed" value="amber-11" /><button id="shuffle">Shuffle</button>
      </div>
      <div class="row">
        <div>
          <label for="mood">Mood</label
          ><select id="mood">
            <option value="lofi">Chill Lo-fi</option>
            <option value="synthwave">Synthwave</option>
            <option value="chiptune">Chiptune</option>
            <option value="techno">Dark Techno</option>
          </select>
        </div>
        <div>
          <label for="mode">Mode</label
          ><select id="mode">
            <option value="song">Song</option>
            <option value="endless">Endless</option>
          </select>
        </div>
        <div>
          <label for="rate">Rate</label
          ><select id="rate">
            <option value="1">100 %</option>
            <option value="0.75">75 %</option>
            <option value="0.5">50 %</option>
          </select>
        </div>
        <div>
          <label for="fromBar">From bar</label
          ><input id="fromBar" type="number" value="0" min="0" />
        </div>
      </div>
      <div class="controls">
        <button id="play" class="primary">Play</button>
        <button id="pause" disabled>Pause</button>
        <button id="stop" disabled>Stop</button>
        <button id="hit" disabled>Hit sound</button>
      </div>
      <label>Status</label>
      <pre id="status">Tap Play to create the AudioContext.</pre>
    </main>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
