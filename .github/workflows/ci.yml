name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · golden · build · size · perf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:golden
      - run: pnpm test:audio
      - run: pnpm build
      - name: Initial JS size vs budget
        run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - name: Perf harness (software renderer thresholds)
        run: PERF_SECONDS=15 node tools/perf/run.ts
